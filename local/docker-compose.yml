# Franz local-dev infrastructure: Postgres + a one-shot that applies the schema
# and seeds local-dev fixtures (the local-kafka-agent registration) so
# `make agent` needs no console step + pgAdmin to browse the DB.
#
#   docker compose -f local/docker-compose.yml up -d --wait postgres
#   docker compose -f local/docker-compose.yml run --rm seed
#   docker compose -f local/docker-compose.yml up -d pgadmin   # http://localhost:5050
#   docker compose -f local/docker-compose.yml down -v
#
# The Makefile drives this: `make deps` = postgres + seed + pgadmin.
#
# Franz itself also applies migrations/ on boot (idempotent, see
# pkg/franz/adapters/out/postgres/db.go); running them here first just lets the
# seed insert its rows before Franz starts. Flyway stays the migration authority
# for real deployments (003.12) — it is not part of this local flow.
name: franz

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: franz
      POSTGRES_USER: franz
      POSTGRES_PASSWORD: franz
    ports:
      - "5432:5432"
    volumes:
      - franz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franz -d franz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies migrations/*.sql then local/seed/*.sql, in order, with psql. Both are
  # idempotent, so this is safe to re-run (`make seed`). Not a schema authority.
  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: franz
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for f in /migrations/*.sql /seed/*.sql; do
          echo "apply: $$f"
          psql -v ON_ERROR_STOP=1 -h postgres -U franz -d franz -f "$$f"
        done
    volumes:
      - ../migrations:/migrations:ro
      - ./seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Browse the schema + data at http://localhost:5050. Desktop mode — no pgAdmin
  # login. The "Franz (local)" server is pre-registered (local/pgadmin/servers.json);
  # it prompts once for the DB password, which is `franz`.
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@franz.dev
      PGADMIN_DEFAULT_PASSWORD: franz
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - franz-pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  franz-pgdata:
  franz-pgadmin:
