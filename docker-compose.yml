# Franz dev services. Postgres + a one-shot Flyway migrate.
#
#   docker compose up -d postgres     # start the database
#   docker compose run --rm flyway    # apply migrations/
#   docker compose down -v            # tear down + drop the volume
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: franz
      POSTGRES_USER: franz
      POSTGRES_PASSWORD: franz
    ports:
      - "5432:5432"
    volumes:
      - franz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franz -d franz"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:10-alpine
    command: >-
      -url=jdbc:postgresql://postgres:5432/franz
      -user=franz -password=franz
      -connectRetries=30
      migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  franz-pgdata:
