services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: franz
      POSTGRES_PASSWORD: franz
      POSTGRES_DB: franz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franz -d franz"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:latest
    platform: linux/amd64
    profiles:
      - migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/franz
      FLYWAY_USER: franz
      FLYWAY_PASSWORD: franz
      FLYWAY_CLEAN_DISABLED: "false"
    volumes:
      - ./resources/db/migrations:/flyway/sql

  flyway-test:
    image: flyway/flyway:latest
    platform: linux/amd64
    profiles:
      - migration
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/franz_test
      FLYWAY_USER: franz
      FLYWAY_PASSWORD: franz
      FLYWAY_CLEAN_DISABLED: "false"
    volumes:
      - ./resources/db/migrations:/flyway/sql

volumes:
  postgres_data:
